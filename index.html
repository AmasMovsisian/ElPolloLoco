<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Pollo Loco</title>
  <link rel="stylesheet" href="./styles/style.css">
  <link rel="icon" type="image/x-icon" href="/ElPolloLoco/img/icons/favicon.jpg">
  <script src="./models/audio.class.js"></script>
  <script src="./models/drawable-object.class.js"></script>
  <script src="./models/bottle-status-bar.class.js"></script>
  <script src="./models/coins-status-bar.class.js"></script>
  <script src="./models/status-bar.class.js"></script>
  <script src="./models/endboss-status-bar.class.js"></script>
  <script src="./models/movable-object.class.js"></script>
  <script src="./models/coins-collection.class.js"></script>
  <script src="./models/bottle-collection.class.js"></script>
  <script src="./models/throwable-object.class.js"></script>
  <script src="./models/character.class.js"></script>
  <script src="./models/chicken.class.js"></script>
  <script src="./models/chicken-small.class.js"></script>
  <script src="./models/cloud.class.js"></script>
  <script src="./models/background-object.class.js"></script>
  <script src="./models/Keyboard.class.js"></script>
  <script src="./models/level.class.js"></script>
  <script src="./models/world.class.js"></script>
  <script src="./models/endboss.class.js"></script>

  <script src="./levels/level1.js"></script>
  <script src="./js/game.js"></script>
</head>

<body>

  <main class="content-limitation">

    <section id="rotationWarningBox" class="rotation-warning-box">
      Bitte das Gerät drehen
    </section>

    <header>
      <h1>El Pollo Loco</h1>
    </header>

    <section id="menu">
      <div class="startContainer">
        <div class="start-img-bg">
          <button class="start-BTN secondery-bg"><a href="./privacy-policy.html"><span>privacy policy</span></a></button>
          <button class="start-BTN" onclick="startGame()"><span>PLAY</span></button>
          <button class="start-BTN secondery-bg"><a href="./about-game.html"><span>About Game</span></a></button>
        </div>
      </div>
    </section>

    <section id="endMenu" class="end-menu">
      <div class="end-container">
        <div class="end-img-bg">
          <button class="end-BTN" onclick="home()">Back to Home</button>
          <button class="end-BTN" onclick="startGame()">Play again</button>
        </div>
      </div>
    </section>

    <section id="lostMenu" class="lost-menu">
      <div class="lost-container">
        <div class="lost-img-bg">
          <button class="end-BTN" onclick="home()">Back to Home</button>
          <button class="end-BTN" onclick="startGame()">Play again</button>
        </div>
      </div>
    </section>

    <section id="canvas-container" class="canvas-container">
      <img src="./img/icons/reset.png" alt="restart_icon" class="restart-icon" id="restartIcon" onclick="startGame()">
      <canvas class="canvas" id="canvas" width="720" height="480" style="display:none;"></canvas>
    </section>

    <div id="mobileIconsContainer" class="mobile-icons-container">
      <img class="mobile-icons m-left" src="./img/mobile_icons/left-chevron.png" alt="left">
      <img class="mobile-icons m-right" src="./img/mobile_icons/right-chevron.png" alt="right">
      <img class="mobile-icons m-jump" src="./img/mobile_icons/jump.png" alt="jump">
      <img class="mobile-icons m-bottle" src="./img/mobile_icons/bottle.png" alt="bottle">
    </div>

    <section id="controlsInfo" class="controls-info">
      <p class="info-text">
        ← or A – Move Left<br>
        → or D – Move Right<br>
        ↑, W, or Space – Jump<br>
        F – Throw Bottle<br>
        <span class="important-text-style">Important! <br>(Next bottle throw is only possible after 2 seconds!)</span>
      </p>
    </section>

    <section class="audio-controls-container" id="audioControllContainer">
      <button class="toggle-mute-btn muted" id="audioToggleBTN" onclick="AudioHub.toggleMute()">
        Sound OFF
      </button>
    </section>

  </main>

</body>

</html>
